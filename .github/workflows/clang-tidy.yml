name: clang-tidy

on:
  push:
    branches: [ "release", "develop", "freeze", "feature/**" ]
  pull_request:
    branches: [ "release", "develop", "freeze", "feature/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
    
    - name: Install libboost
      run: sudo apt-get install -y libboost-all-dev

    - name: Configure CMake
      run: >
        cmake -S ${{ github.workspace }} -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=Debug
        -DFORTE_ARCHITECTURE=Posix
        -DFORTE_COM_ETH=ON
        -DFORTE_COM_FBDK=ON
        -DFORTE_COM_HTTP=ON
        -DFORTE_COM_LOCAL=ON
        -DFORTE_COM_RAW=ON
        -DFORTE_COM_SER=ON
        -DFORTE_COM_STRUCT_MEMBER=ON
        -DFORTE_IO=ON
        -DFORTE_MODULE_CONVERT=ON
        -DFORTE_MODULE_IEC61131=ON
        -DFORTE_MODULE_RECONFIGURATION=ON
        -DFORTE_MODULE_RT_Events=ON
        -DFORTE_MODULE_SIGNALPROCESSING=ON
        -DFORTE_MODULE_UTILS=ON
        -DFORTE_BUILD_STATIC_LIBRARY=ON
        -DFORTE_BUILD_SHARED_LIBRARY=ON
        -DFORTE_C_INTERFACE=ON
        -DFORTE_TESTS=ON
        -DFORTE_CLANG_TIDY_MODE=WARNING

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }}
