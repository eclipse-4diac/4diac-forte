# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "release", "develop", "freeze", "feature/**", "3.0.x" ]
  pull_request:
    branches: [ "release", "develop", "freeze", "feature/**", "3.0.x" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Debug ]
        c_compiler: [ gcc, clang, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            architecture: "windows"
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            architecture: "posix"
            container: ubuntu:25.10
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            architecture: "posix"
            container: ubuntu:25.10
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure environment
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"

      - name: Install build dependencies (container)
        if: ${{ matrix.container }}
        run: apt-get update && apt-get install -y cmake git ninja-build ${{ matrix.c_compiler == 'clang' && 'clang' || 'g++' }}

      - name: Install libboost (Linux)
        if: ${{ matrix.os != 'windows-latest' }}
        run: apt-get install -y libboost-all-dev

      - name: Install open62541 (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: apt-get install -y libopen62541-1.4-dev libopen62541-1.4-tools

      - name: Install boost (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: nuget install boost -Version 1.84.0

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -S ${{ env.GITHUB_WORKSPACE }} -B ${{ env.BUILD_DIR }}
          --preset ${{ matrix.architecture }}-systemtests
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DFORTE_COM_OPC_UA=${{ matrix.os == 'ubuntu-latest' && 'ON' || 'OFF' }}
          ${{ matrix.os == 'windows-latest' && format('-DFORTE_TESTS_INC_DIRS={0}/boost.1.84.0/lib/native/include', env.GITHUB_WORKSPACE) || '' }}

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --build-config ${{ matrix.build_type }} --verbose
